[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui"] }
avian3d = "0.7.0"
bevy_enhanced_input = "0.26.0"

gf_core = { path = "crates/gf_core" }
gf_input = { path = "crates/gf_input" }
gf_physics = { path = "crates/gf_physics" }
gf_character = { path = "crates/gf_character" }
gf_animation = { path = "crates/gf_animation" }
gf_player = { path = "crates/gf_player" }
gf_camera = { path = "crates/gf_camera" }
gf_ui = { path = "crates/gf_ui" }
gf_world = { path = "crates/gf_world" }
gf_render = { path = "crates/gf_render" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_pass_by_value = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
